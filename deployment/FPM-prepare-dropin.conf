[Service]
# Only this FPM unit rebuilds the private cache. The publisher restarts FPM first,
# waits for success, then restarts queue and Reverb without rebuilding the cache.
ExecStartPre=/usr/sbin/runuser -u dogeow-test-game-api -- /usr/bin/php8.5 /usr/local/libexec/prepare-dogeow-test-game-api.php
